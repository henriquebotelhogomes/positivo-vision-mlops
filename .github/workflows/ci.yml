name: CI/CD Pipeline - Positivo Vision MLOps

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Linting & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Instalar uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python 3.12 via uv
        run: uv python install 3.12

      - name: Instalar Dependências do Projeto
        run: uv sync --frozen --extra dev

      - name: Executar Linter Estático (Ruff)
        run: uv run ruff check .

      - name: Executar Bateria de Testes (Pytest)
        env:
          APP_ENV: test
          LOG_LEVEL: WARNING
        run: uv run pytest -v --durations=10

  docker-build-verification:
    name: Docker Multi-Stage Build & Container Sanity Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Liberar Espaço em Disco no Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar Imagem Docker de Produção
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: positivo-vision-mlops:test
          load: true

      - name: Iniciar Container e Testar Healthcheck Probe
        run: |
          docker run -d --name test_app -p 8000:8000 -e APP_ENV=production -e PORT=8000 positivo-vision-mlops:test
          sleep 5
          docker ps
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/healthz || (docker logs test_app && exit 1)
          docker stop test_app

      - name: Autenticar no GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Imagem no GitHub Packages (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag positivo-vision-mlops:test "${IMAGE_LOWER}:latest"
          docker tag positivo-vision-mlops:test "${IMAGE_LOWER}:${{ github.sha }}"
          docker tag positivo-vision-mlops:test "${IMAGE_LOWER}:v1.0.0"
          docker push "${IMAGE_LOWER}:latest"
          docker push "${IMAGE_LOWER}:${{ github.sha }}"
          docker push "${IMAGE_LOWER}:v1.0.0"

