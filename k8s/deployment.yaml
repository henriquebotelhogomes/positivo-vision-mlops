apiVersion: apps/v1
kind: Deployment
metadata:
  name: positivo-vision-mlops
  namespace: positivo-vision
  labels:
    app.kubernetes.io/name: positivo-vision-mlops
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: smart-factory-smt
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: positivo-vision-mlops
  template:
    metadata:
      labels:
        app: positivo-vision-mlops
        app.kubernetes.io/name: positivo-vision-mlops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: vision-api
          image: gcr.io/positivo-tecnologia-mlops/vision-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: positivo-vision-config
            - secretRef:
                name: positivo-vision-secrets
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: telemetry-storage
              mountPath: /app/data/telemetry
      volumes:
        - name: telemetry-storage
          emptyDir: {}
