apiVersion: v1
kind: ConfigMap
metadata:
  name: positivo-vision-config
  namespace: positivo-vision
  labels:
    app.kubernetes.io/name: positivo-vision-mlops
data:
  APP_NAME: "Positivo Vision MLOps"
  APP_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_INFERENCE: "60/minute"
  RATE_LIMIT_REPORT: "20/minute"
  MODEL_PATH: "models/champion.onnx"
  MODEL_ALIAS: "@champion"
  DATA_SAMPLE_POOL_DIR: "data/sample_pool"
  DATA_TELEMETRY_DIR: "data/telemetry"
  MLFLOW_EXPERIMENT_NAME: "positivo-pcb-inspection"
  MLFLOW_TRACKING_URI: "https://dagshub.com/henriquebotelhogomes/positivo-vision-mlops.mlflow"
  DAGSHUB_REPO_OWNER: "henriquebotelhogomes"
  DAGSHUB_REPO_NAME: "positivo-vision-mlops"
