[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "positivo-vision-mlops"
version = "0.1.0"
description = "Plataforma Industrial de Inspeção Visual de PCBs, Otimização de Borda & Governança de Modelos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Henrique", email = "developer@positivovision.local" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxscript>=0.7.0",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.15.0",
    "polars>=1.6.0",
    "pyarrow>=17.0.0",
    "structlog>=24.4.0",
    "openai>=1.40.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "dagshub>=0.7.2",
    "duckdb>=1.5.5",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
